# Google Sheets LLM Inference System - Configuration
# ===================================================
#
# Red-teaming lineup. Claude uses the native API (ANTHROPIC_API_KEY);
# everything else goes via OpenRouter (OPENROUTER_API_KEY), including OpenAI
# models until the OpenAI account has credits again.
# Models are ordered by how well we EXPECT them to resist clinical red teaming,
# most robust first. That ordering is a guess; the exercise is the test.
#
# IDs and prices checked against https://openrouter.ai/api/v1/models, Oct 2026.
# Prices are $/1M tokens (input / output).
#
# Models run sequentially per prompt, so every model you add slows live mode.
#
# Run: python sheets_inference.py --sheet-url URL --config models.yaml --mode live

google_sheets:
  credentials_file: ${HOME}/.config/gspread/service_account.json

models:
  # =========================================================================
  # Current frontier, cheap tier (expected: robust)
  # =========================================================================

  # Anthropic, current Haiku. $0.10 / $0.50
  - name: claude-haiku-5.5
    backend: anthropic
    model_id: claude-haiku-5-5
    temperature: null  # rejected by this model
    max_tokens: 1000

  # OpenAI, current small model. $0.10 / $0.50
  - name: gpt-6-luna
    backend: openai
    base_url: https://openrouter.ai/api/v1  # OpenAI account has no credits; drop these two lines to go native
    api_key: ${OPENROUTER_API_KEY}
    model_id: openai/gpt-6-luna
    temperature: 0.7
    max_tokens: 1000

  # =========================================================================
  # Chinese open-weight frontier (expected: middle)
  # =========================================================================

  # DeepSeek. $0.30 / $1.20
  - name: deepseek-v4.1-flash
    backend: openai
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    model_id: deepseek/deepseek-v4.1-flash
    temperature: 0.7
    max_tokens: 1500
    extra_body:
      reasoning:
        enabled: false  # fast chat mode; same safety calls as thinking mode in testing, 3-6x fewer tokens

  # Moonshot Kimi. $0.47 / $2.45
  - name: kimi-k2.6
    backend: openai
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    model_id: moonshotai/kimi-k2.6
    temperature: 0.7
    max_tokens: 1500
    extra_body:
      reasoning:
        enabled: false  # fast chat mode; same safety calls as thinking mode in testing, 3-6x fewer tokens

  # =========================================================================
  # Older generation (expected: more fragile)
  # =========================================================================

  # GPT-4o mini, 2024. $0.15 / $0.60
  - name: gpt-4o-mini
    backend: openai
    base_url: https://openrouter.ai/api/v1  # OpenAI account has no credits; drop these two lines to go native
    api_key: ${OPENROUTER_API_KEY}
    model_id: openai/gpt-4o-mini
    temperature: 0.7
    max_tokens: 1000

  # GPT-3.5 Turbo, the 2023 ChatGPT. OpenAI shuts it down 23 Oct 2026. $0.50 / $1.50
  - name: gpt-3.5-turbo
    backend: openai
    base_url: https://openrouter.ai/api/v1  # OpenAI account has no credits; drop these two lines to go native
    api_key: ${OPENROUTER_API_KEY}
    model_id: openai/gpt-3.5-turbo
    temperature: 0.7
    max_tokens: 1000

  # =========================================================================
  # Small / lightly aligned open models (expected: most fragile)
  # =========================================================================

  # Meta Llama 3.1 8B, 2024. $0.05 / $0.08
  - name: llama-3.1-8b
    backend: openai
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    model_id: meta-llama/llama-3.1-8b-instruct
    temperature: 0.7
    max_tokens: 1000

  # Deliberately uncensored fine-tune: the "Shoggoth" stand-in, no local GPU needed.
  # It will answer anything, so expect outright harmful output on the shared screen.
  # $0.20 / $0.90
  - name: dolphin-uncensored
    backend: openai
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    model_id: cognitivecomputations/dolphin-mistral-24b-venice-edition
    temperature: 0.7
    max_tokens: 1000

  # =========================================================================
  # Optional extras (uncomment to add)
  # =========================================================================

  # Anthropic Sonnet, current. $2 / $10
  # - name: claude-sonnet-5.5
  #   backend: anthropic
  #   model_id: claude-sonnet-5-5
  #   temperature: null  # rejected by this model
  #   max_tokens: 1000

  # Google, cheap current. $0.30 / $2.50
  # - name: gemini-3.5-flash-lite
  #   backend: openai
  #   base_url: https://openrouter.ai/api/v1
  #   api_key: ${OPENROUTER_API_KEY}
  #   model_id: google/gemini-3.5-flash-lite
  #   temperature: 0.7
  #   max_tokens: 1000

  # Local alternatives (need Ollama or a GPU), kept for reference:
  # - name: qwen2.5-base-UNSAFE   # unaligned base model
  #   backend: huggingface
  #   model_id: Qwen/Qwen2.5-7B
  #   temperature: 0.7
  #   max_tokens: 300
  #   device: mps

# API Keys
# --------
# Native Claude/OpenAI models use these; OpenRouter models use their own api_key.
#   export OPENAI_API_KEY=sk-proj-...
#   export ANTHROPIC_API_KEY=sk-ant-...
#   export OPENROUTER_API_KEY=sk-or-...
api_keys:
  openai: ${OPENAI_API_KEY}
  anthropic: ${ANTHROPIC_API_KEY}
