# Google Sheets LLM Inference System - Configuration
# ===================================================
#
# This file configures the models and authentication for the inference system.
# Environment variables can be referenced using ${VAR_NAME} syntax.
#
# Setup Steps:
# 1. Create a Google Cloud service account
# 2. Download the JSON key file
# 3. Share your Google Sheet with the service account email
# 4. Set API keys as environment variables
# 5. Run: python sheets_inference.py --sheet-url YOUR_URL --config models_no_llama.yaml

# Google Sheets Authentication
# ----------------------------
# Reference: https://docs.gspread.org/en/v6.1.4/oauth2.html#for-bots-using-service-account
#
# Create a service account:
# 1. Go to https://console.cloud.google.com/iam-admin/serviceaccounts
# 2. Create a new service account
# 3. Create and download a JSON key
# 4. Enable Google Sheets API: https://console.cloud.google.com/apis/library/sheets.googleapis.com
# 5. Share your spreadsheet with the service account email (Editor access)
google_sheets:
  credentials_file: ${HOME}/.config/gspread/service_account.json


# Local GPU lineup: HuggingFace models only, no API keys needed except HF_TOKEN
# for gated models. models.yaml is the main (API) lineup; see it and the
# README for the field reference.

models:
  # =========================================================================
  # HuggingFace Transformers (Local GPU Inference)
  # =========================================================================
  # Reference: https://huggingface.co/models
  #
  # Requires: pip install transformers torch accelerate
  #
  # Device options:
  #   - cuda : NVIDIA GPU (recommended for large models)
  #   - mps  : Apple Silicon GPU
  #   - cpu  : CPU only (slow for models >1B params)
  #
  # Popular models:
  #   - microsoft/Phi-3.5-mini-instruct   : 3.8B params
  #   - google/gemma-2-2b-it              : 2B, fast
  #   - Qwen/Qwen2.5-0.5B-Instruct        : 0.5B, very fast
  #   - meta-llama/Llama-3.2-1B-Instruct  : 1B, requires HF token

  # Best multilingual open model (Hebrew/Arabic)
  - name: qwen2.5-7b-instruct
    backend: huggingface
    model_id: Qwen/Qwen2.5-7B-Instruct
    temperature: 0.7
    max_tokens: 500
    device: cuda

  # Alternative multilingual (purpose-built)
  # - name: aya-23-8b
  #   backend: huggingface
  #   model_id: CohereForAI/aya-23-8B
  #   temperature: 0.7
  #   max_tokens: 300
  #   device: cuda

  - name: qwen2.5-7b-base-UNSAFE
    backend: huggingface
    model_id: Qwen/Qwen2.5-7B
    temperature: 0.7
    max_tokens: 500
    device: cuda

  # - name: wizardlm-7b-uncensored
  #   model_id: QuixiAI/WizardLM-7B-Uncensored 
  #   backend: huggingface
  #   temperature: 0.7
  #   max_tokens: 500
  #   device: cuda
  - name: dolphin-2.9-8b-uncensored
    model_id: dphn/dolphin-2.9-llama3-8b
    backend: huggingface
    temperature: 0.7
    max_tokens: 500
    device: cuda

  # # Optional: smaller model for speed testing
  # - name: qwen2.5-3b-instruct
  #   backend: huggingface
  #   model_id: Qwen/Qwen2.5-3B-Instruct
  #   temperature: 0.7
  #   max_tokens: 300
  #   device: cuda
# API Keys
# --------
# Use environment variables for security. Set them before running:
#
#   export HF_TOKEN=hf_...  # Only for gated models
#
# Or put it in a .env file in the same directory.
#
# The ${VAR_NAME} syntax will be replaced with the environment variable value.

api_keys:
  openai: ${OPENAI_API_KEY}
  anthropic: ${ANTHROPIC_API_KEY}
  # huggingface: ${HF_TOKEN}  # Uncomment for gated HuggingFace models
