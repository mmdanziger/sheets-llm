# Google Sheets LLM Inference System - Configuration
# ===================================================
#
# This file configures the models and authentication for the inference system.
# Environment variables can be referenced using ${VAR_NAME} syntax.
#
# Setup Steps:
# 1. Create a Google Cloud service account
# 2. Download the JSON key file
# 3. Share your Google Sheet with the service account email
# 4. Set API keys as environment variables
# 5. Run: python sheets_inference.py --sheet-url YOUR_URL --config models.yaml

# Google Sheets Authentication
# ----------------------------
# Reference: https://docs.gspread.org/en/v6.1.4/oauth2.html#for-bots-using-service-account
#
# Create a service account:
# 1. Go to https://console.cloud.google.com/iam-admin/serviceaccounts
# 2. Create a new service account
# 3. Create and download a JSON key
# 4. Enable Google Sheets API: https://console.cloud.google.com/apis/library/sheets.googleapis.com
# 5. Share your spreadsheet with the service account email (Editor access)
google_sheets:
  credentials_file: ${HOME}/.config/gspread/service_account.json


# Model Definitions
# -----------------
# Each model entry creates a worksheet in your Google Sheet with the same name.
# The worksheet stores responses from that specific model.
#
# Required fields:
#   name: Unique identifier (becomes worksheet name, max 100 chars)
#   backend: openai | anthropic | ollama | huggingface
#   model_id: The model identifier for the specific backend
#
# Optional fields:
#   temperature: 0.0-2.0, controls randomness (default: 0.7)
#   max_tokens: Maximum response length (default: 300)
#   system_prompt: Optional system/context message
#   device: For huggingface only - cuda | mps | cpu
#   base_url: For ollama only - custom API endpoint

models:
  # =========================================================================
  # OpenAI Models
  # =========================================================================
  # Reference: https://platform.openai.com/docs/models
  # Pricing: https://openai.com/api/pricing/
  #
  # Model IDs (as of December 2024):
  #   - gpt-4o           : Latest GPT-4o, 128k context
  #   - gpt-4o-mini      : Smaller, faster, cheaper GPT-4o
  #   - gpt-4-turbo      : Previous flagship, 128k context
  #   - gpt-3.5-turbo    : Fast and cheap, 16k context

  # - name: gpt-4o
  #   backend: openai
  #   model_id: gpt-4o
  #   temperature: 0.7
  #   max_tokens: 500
  #   # system_prompt: "You are a helpful assistant."

  # - name: gpt-4o-mini
  #   backend: openai
  #   model_id: gpt-4o-mini
  #   temperature: 0.7
  #   max_tokens: 500

  - name: gpt-3.5-turbo
    backend: openai
    model_id: gpt-3.5-turbo
    temperature: 0.7
    max_tokens: 300

  # =========================================================================
  # Anthropic Claude Models
  # =========================================================================
  # Reference: https://docs.anthropic.com/en/docs/about-claude/models
  # Pricing: https://www.anthropic.com/pricing
  #
  # Model IDs (as of December 2024):
  #   - claude-sonnet-4-20250514      : Claude Sonnet 4, balanced
  #   - claude-3-5-sonnet-20241022    : Claude 3.5 Sonnet, fast + capable
  #   - claude-3-5-haiku-20241022     : Claude 3.5 Haiku, fastest
  #   - claude-3-opus-20240229        : Claude 3 Opus, most capable

  # - name: claude-sonnet-4
  #   backend: anthropic
  #   model_id: claude-sonnet-4-20250514
  #   temperature: 0.7
  #   max_tokens: 500

  # - name: claude-3-5-sonnet
  #   backend: anthropic
  #   model_id: claude-3-5-sonnet-20241022
  #   temperature: 0.7
  #   max_tokens: 500

  - name: claude-3-haiku
    backend: anthropic
    model_id: claude-3-haiku-20240307
    temperature: 0.7
    max_tokens: 300


  # =========================================================================
  # HuggingFace Transformers (Local GPU Inference)
  # =========================================================================
  # Reference: https://huggingface.co/models
  #
  # Requires: pip install transformers torch accelerate
  #
  # Device options:
  #   - cuda : NVIDIA GPU (recommended for large models)
  #   - mps  : Apple Silicon GPU
  #   - cpu  : CPU only (slow for models >1B params)
  #
  # Popular models:
  #   - microsoft/Phi-3-mini-4k-instruct  : 3.8B params, good quality
  #   - microsoft/Phi-3.5-mini-instruct   : Latest Phi, better reasoning
  #   - google/gemma-2-2b-it              : 2B, fast
  #   - Qwen/Qwen2.5-0.5B-Instruct        : 0.5B, very fast
  #   - meta-llama/Llama-3.2-1B-Instruct  : 1B, requires HF token
models:
  # Frontier baselines (API)
  # Best multilingual open model (Hebrew/Arabic)
  - name: qwen2.5-7b-instruct
    backend: huggingface
    model_id: Qwen/Qwen2.5-7B-Instruct
    temperature: 0.7
    max_tokens: 300
    device: cuda

  # Alternative multilingual (purpose-built)
  - name: aya-23-8b
    backend: huggingface
    model_id: CohereForAI/aya-23-8B
    temperature: 0.7
    max_tokens: 300
    device: cuda

  # The "Shoggoth" - unaligned base model
  - name: qwen2.5-7b-base-UNSAFE
    backend: huggingface
    model_id: Qwen/Qwen2.5-7B
    temperature: 0.7
    max_tokens: 300
    device: cuda

  # Optional: smaller model for speed testing
  - name: qwen2.5-3b-instruct
    backend: huggingface
    model_id: Qwen/Qwen2.5-3B-Instruct
    temperature: 0.7
    max_tokens: 300
    device: cuda
# API Keys
# --------
# Use environment variables for security. Set them before running:
#
#   export OPENAI_API_KEY=sk-proj-...
#   export ANTHROPIC_API_KEY=sk-ant-api03-...
#   export HF_TOKEN=hf_...  # Only for gated models
#
# Or create a .env file in the same directory:
#
#   OPENAI_API_KEY=sk-proj-...
#   ANTHROPIC_API_KEY=sk-ant-api03-...
#
# The ${VAR_NAME} syntax will be replaced with the environment variable value.

api_keys:
  openai: ${OPENAI_API_KEY}
  anthropic: ${ANTHROPIC_API_KEY}
  # huggingface: ${HF_TOKEN}  # Uncomment for gated HuggingFace models
